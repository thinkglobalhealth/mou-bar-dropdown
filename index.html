<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .dropdown-container {
    margin: 10px auto;
    max-width: 800px;
    font-family: Season Sans, Arial, Helvetica, sans-serif;
  }
  
  .dropdown-wrapper {
    position: relative;
    margin-bottom: 20px;
    display: inline-block;
    max-width: 300px;
  }
  
  select {
    width: 100%;
    padding: 12px 40px 12px 16px;
    font-size: 14px;
    font-family: Season Sans, Arial, Helvetica, sans-serif;
    color: #333333;
    background-color: #ffffff;
    border: 1px solid #333333;
    border-radius: 0;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    outline: none;
    transition: border-color 0.2s;
  }
  
  select:hover {
    border-color: #555555;
  }
  
  select:focus {
    border-color: #000000;
  }
  
/*arrow*/
.dropdown-wrapper::after {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-60%) rotate(45deg);
    width: 8px;
    height: 8px;
    border-right: 2px solid #e67e22;
    border-bottom: 2px solid #e67e22;
    pointer-events: none;
  }
  
  .chart-wrapper {
    position: relative;
    width: 100%;
    min-height: 400px;
  }
  
  .chart-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    opacity: 0;
    pointer-events: none;
  }
  
  .chart-frame.active {
    opacity: 1;
    pointer-events: auto;
    position: relative;
  }
</style>
</head>
<body>

  </div>
</div>

<script>
  const chartFrames = document.querySelectorAll('.chart-frame');
  const selector = document.getElementById('chart-selector');
  
  // Update chart when dropdown changes
  selector.addEventListener('change', function() {
    const index = parseInt(this.value);
    
    // Hide all charts and show the selected one
    chartFrames.forEach((frame, i) => {
      if (i === index) {
        frame.classList.add('active');
      } else {
        frame.classList.remove('active');
      }
    });
  });
</script>
